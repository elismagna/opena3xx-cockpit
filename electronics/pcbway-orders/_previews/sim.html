<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Panel sim — Falstad</title>
  <style>
    :root {
      --bg: #000000;
      --chrome: #1a1a1a;
      --chrome2: #242424;
      --line: #3a3a3a;
      --text: #e8e8e8;
      --muted: #9a9a9a;
      --accent: #4caf50;
      --wire: #00e676;
      --lamp: #ffeb3b;
      --danger: #ef5350;
    }
    * { box-sizing: border-box; }
    html, body {
      margin: 0; height: 100%; overflow: hidden;
      background: var(--bg); color: var(--text);
      font-family: Tahoma, "Segoe UI", sans-serif;
    }
    #app {
      height: 100%;
      display: grid;
      grid-template-rows: 40px 1fr;
    }

    /* Falstad-like top icon toolbar */
    #toolbar {
      display: flex; align-items: center; gap: 2px;
      padding: 0 6px;
      background: linear-gradient(#2b2b2b, #1e1e1e);
      border-bottom: 1px solid #0d0d0d;
      box-shadow: inset 0 1px 0 #3a3a3a;
    }
    #toolbar .brand {
      font-size: 12px; font-weight: 700; letter-spacing: 0.02em;
      padding: 0 10px 0 4px; color: #ddd; white-space: nowrap;
    }
    #toolbar .brand span { color: var(--wire); font-weight: 600; margin-left: 6px; }
    .tool {
      appearance: none; border: 1px solid transparent; background: transparent;
      color: var(--text); width: 32px; height: 28px; border-radius: 3px;
      cursor: pointer; font-size: 14px; line-height: 1; padding: 0;
      display: inline-flex; align-items: center; justify-content: center;
    }
    .tool:hover { background: #333; border-color: #555; }
    .tool.on, .tool:active { background: #0d3d12; border-color: var(--accent); color: var(--wire); }
    .tool.wide {
      width: auto; padding: 0 10px; font-size: 11px; font-weight: 600;
      border: 1px solid #444; background: #2a2a2a; margin-left: 4px;
    }
    .tool.wide.run { background: #1b5e20; border-color: #2e7d32; color: #c8e6c9; }
    .tool.wide.run.stopped { background: #5d1a1a; border-color: #8b0000; color: #ffcdd2; }
    .sep {
      width: 1px; height: 22px; background: #444; margin: 0 6px;
    }
    #toolbar select {
      background: #111; color: var(--text); border: 1px solid #444;
      border-radius: 3px; padding: 3px 6px; font: inherit; font-size: 11px;
      max-width: 180px;
    }
    #toolbar a.link {
      color: var(--muted); font-size: 11px; text-decoration: none;
      padding: 0 8px;
    }
    #toolbar a.link:hover { color: var(--wire); }
    #status {
      margin-left: auto; font-size: 11px; color: var(--muted);
      padding-right: 8px; white-space: nowrap;
    }

    /* Main: CircuitJS hero + dock */
    #workspace {
      display: grid;
      grid-template-columns: 260px minmax(0, 1fr);
      min-height: 0;
      background: #000;
    }
    #dock {
      display: grid;
      grid-template-rows: 1fr 1fr;
      border-right: 1px solid #111;
      background: var(--chrome);
      min-height: 0;
    }
    #dock .block {
      display: flex; flex-direction: column; min-height: 0;
      border-bottom: 1px solid #111;
    }
    #dock .block:last-child { border-bottom: 0; }
    #dock .cap {
      font-size: 10px; text-transform: uppercase; letter-spacing: 0.08em;
      color: var(--muted); padding: 6px 8px 4px;
      background: var(--chrome2); border-bottom: 1px solid #111;
    }
    #view3d, #falstad {
      border: 0; width: 100%; flex: 1; background: #000; min-height: 0;
    }
    #falstad-wrap {
      display: flex; flex-direction: column; min-width: 0; min-height: 0;
      background: #000;
    }
    #list {
      overflow: auto; padding: 6px; flex: 1;
    }
    .hint {
      color: var(--muted); font-size: 10px; line-height: 1.35;
      padding: 4px 2px 8px;
    }
    .sw {
      display: grid; grid-template-columns: 1fr auto; gap: 6px; align-items: center;
      width: 100%; text-align: left; margin-bottom: 4px;
      padding: 7px 8px; border-radius: 2px;
      border: 1px solid #333; background: #151515; color: inherit;
      cursor: pointer; font: inherit;
    }
    .sw:hover { border-color: #555; }
    .sw.on {
      border-color: var(--accent); background: #0d1f10;
      box-shadow: inset 0 0 0 1px #1b5e20;
    }
    .sw .n { font-size: 12px; font-weight: 700; }
    .sw .s { font-size: 10px; color: var(--muted); margin-top: 2px; }
    .lamp {
      width: 10px; height: 10px; border-radius: 50%;
      background: #222; box-shadow: inset 0 0 0 1px #555;
    }
    .sw.on .lamp {
      background: var(--lamp);
      box-shadow: 0 0 8px #ffeb3b99, 0 0 2px #fff;
    }

    @media (max-width: 900px) {
      #workspace { grid-template-columns: 1fr; grid-template-rows: 38vh 1fr; }
      #dock { grid-template-rows: 1fr 140px; border-right: 0; border-bottom: 1px solid #111; }
    }
  </style>
</head>
<body>
  <div id="app">
    <div id="toolbar">
      <div class="brand">CircuitJS<span id="boardLabel">ADIRS</span></div>
      <div class="sep"></div>
      <button type="button" class="tool" id="btnNew" title="Reload blank open switches">⟲</button>
      <button type="button" class="tool" id="btnReload" title="Reload circuit">↻</button>
      <div class="sep"></div>
      <select id="boardSelect" title="Panel board"></select>
      <button type="button" class="tool wide run" id="btnRun">RUN</button>
      <button type="button" class="tool wide" id="btnStop">Stop</button>
      <div class="sep"></div>
      <span id="status">Starting…</span>
      <a class="link" href="viewer3d.html" id="link3d">3D only</a>
      <a class="link" href="index.html">Gallery</a>
    </div>

    <div id="workspace">
      <aside id="dock">
        <div class="block">
          <div class="cap">Board</div>
          <iframe id="view3d" title="3D board"></iframe>
        </div>
        <div class="block">
          <div class="cap">Panel controls</div>
          <div id="list">
            <div class="hint">Press a face control — switch closes in the schematic. Yellow current dots = live path. Use Falstad’s right sliders &amp; bottom scopes as usual.</div>
          </div>
        </div>
      </aside>
      <div id="falstad-wrap">
        <iframe id="falstad" title="CircuitJS Falstad" src="about:blank"></iframe>
      </div>
    </div>
  </div>
  <script>
    const params = new URLSearchParams(location.search);
    let boardId = params.get("board") || "21-adirs";
    let index = { boards: [] };
    let current = null;
    let circuitText = "";
    let closed = new Set();
    let falstadReady = false;
    let running = true;

    const boardSelect = document.getElementById("boardSelect");
    const list = document.getElementById("list");
    const status = document.getElementById("status");
    const falstad = document.getElementById("falstad");
    const view3d = document.getElementById("view3d");
    const btnRun = document.getElementById("btnRun");

    function setStatus(t) { status.textContent = t; }

    function setRunning(on) {
      running = !!on;
      btnRun.classList.toggle("stopped", !running);
      btnRun.textContent = running ? "RUN" : "Stopped";
      try {
        falstad.contentWindow?.postMessage({ type: "run", value: running }, "*");
        const api = falstad.contentWindow?.CircuitJS1;
        if (api?.setSimRunning) api.setSimRunning(running);
      } catch (_) {}
    }

    async function loadIndex() {
      index = await (await fetch("circuitjs/circuits-index.json")).json();
      boardSelect.innerHTML = "";
      for (const b of index.boards) {
        const opt = document.createElement("option");
        opt.value = b.id;
        opt.textContent = b.title;
        boardSelect.appendChild(opt);
      }
      if (!index.boards.some((b) => b.id === boardId)) boardId = index.boards[0]?.id;
      boardSelect.value = boardId;
    }

    async function fetchCircuit(id) {
      const meta = index.boards.find((b) => b.id === id);
      if (!meta) throw new Error("Unknown board");
      const text = await (await fetch("circuitjs/" + meta.file)).text();
      return { meta, text };
    }

    function applySwitchStates(text, closedSet) {
      let i = 0;
      return text.split("\n").map((line) => {
        if (!line.startsWith("S ")) return line;
        const parts = line.split(" ");
        if (parts.length >= 7) parts[6] = closedSet.has(i) ? "1" : "0";
        i += 1;
        return parts.join(" ");
      }).join("\n");
    }

    function renderControls() {
      const hint = `<div class="hint">Press a face control — switch closes in the schematic. Yellow current dots = live path. Use Falstad’s right sliders &amp; bottom scopes as usual.</div>`;
      list.innerHTML = hint;
      (current?.controls || []).forEach((name, i) => {
        const btn = document.createElement("button");
        btn.type = "button";
        btn.className = "sw" + (closed.has(i) ? " on" : "");
        btn.innerHTML = `<div><div class="n">${name}</div><div class="s">${closed.has(i) ? "Closed — path live" : "Open — click"}</div></div><span class="lamp"></span>`;
        btn.addEventListener("click", () => {
          if (closed.has(i)) closed.delete(i); else closed.add(i);
          pushCircuit();
          renderControls();
        });
        list.appendChild(btn);
      });
    }

    function pushCircuit() {
      const text = applySwitchStates(circuitText, closed);
      let usedApi = false;
      try {
        const api = falstad.contentWindow && falstad.contentWindow.CircuitJS1;
        if (api && typeof api.importCircuit === "function") {
          api.importCircuit(text);
          try { api.setSimRunning(running); } catch (_) {}
          usedApi = true;
        }
      } catch (_) {}
      if (!usedApi) {
        falstadReady = false;
        falstad.src = "circuitjs/embed.html?cct=" + encodeURIComponent(text);
      } else {
        falstad.contentWindow.postMessage({ type: "import", circuit: text }, "*");
      }
      setStatus(`${current.title} · ${closed.size} pressed`);
    }

    async function showBoard(id) {
      boardId = id;
      closed = new Set();
      history.replaceState(null, "", `?board=${encodeURIComponent(id)}`);
      document.getElementById("link3d").href = `viewer3d.html?board=${encodeURIComponent(id)}`;
      document.getElementById("boardLabel").textContent = "";
      view3d.src = `viewer3d.html?board=${encodeURIComponent(id)}&embed=1`;
      const { meta, text } = await fetchCircuit(id);
      current = meta;
      circuitText = text;
      boardSelect.value = id;
      document.getElementById("boardLabel").textContent = meta.title;
      falstadReady = false;
      falstad.src = "circuitjs/embed.html?cct=" + encodeURIComponent(text);
      renderControls();
      setStatus(`Loaded ${meta.title}`);
      setRunning(true);
    }

    window.addEventListener("message", (ev) => {
      const msg = ev.data || {};
      if (msg.type === "circuitjs-ready") {
        falstadReady = true;
        setRunning(running);
        setStatus(`${current?.title || ""} · Falstad ready`);
      }
      if (msg.type === "select-part" && current) {
        const i = current.controls.findIndex(
          (c) => c === msg.label || c.replace(/\s/g, "_") === String(msg.label || "").replace(/\s/g, "_")
        );
        if (i >= 0) {
          closed.add(i);
          pushCircuit();
          renderControls();
        }
      }
    });

    boardSelect.addEventListener("change", () => showBoard(boardSelect.value));
    document.getElementById("btnReload").addEventListener("click", () => showBoard(boardId));
    document.getElementById("btnNew").addEventListener("click", () => {
      closed = new Set();
      pushCircuit();
      renderControls();
    });
    btnRun.addEventListener("click", () => setRunning(true));
    document.getElementById("btnStop").addEventListener("click", () => setRunning(false));

    (async function boot() {
      try {
        await loadIndex();
        await showBoard(boardId);
      } catch (e) {
        console.error(e);
        setStatus(String(e.message || e));
      }
    })();
  </script>
</body>
</html>
